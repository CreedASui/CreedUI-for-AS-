name: Package Creed UI test ZIP

on:
  push:
    branches:
      - fix/nested-options-window-layering
    paths:
      - "CreedUI/**"
      - ".github/workflows/package-creedui-zip.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Verify addon structure and package
        shell: bash
        run: |
          set -euo pipefail
          test -f CreedUI/CreedUI.toc
          test -d CreedUI/Art
          test -d CreedUI/Fonts
          mkdir -p "$RUNNER_TEMP/package"
          cd "$GITHUB_WORKSPACE"
          zip -qr "$RUNNER_TEMP/package/CreedUI-layering-fix.zip" CreedUI
          unzip -l "$RUNNER_TEMP/package/CreedUI-layering-fix.zip" | grep -q "CreedUI/CreedUI.toc"
          unzip -t "$RUNNER_TEMP/package/CreedUI-layering-fix.zip"
      - name: Upload installable addon ZIP
        uses: actions/upload-artifact@v4
        with:
          name: CreedUI-layering-fix
          path: ${{ runner.temp }}/package/CreedUI-layering-fix.zip
          if-no-files-found: error
          retention-days: 7
